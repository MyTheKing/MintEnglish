# MintEnglish — 静态站点 Nginx 配置
# 用法: 把 dist/ 里的内容拷到 /var/www/mint-english, 将本文件放入 /etc/nginx/conf.d/mint-english.conf
# 注意: 应用使用 HashRouter (路由形如 /#/reading), 因此【无需】SPA history 回退重写。

server {
    listen       80;
    server_name  your-domain.com;          # 改成你的域名或公网 IP

    root   /var/www/mint-english;          # = 部署上去的 dist 目录
    index  index.html;

    # gzip 压缩 (JS/CSS 体积大, 开启后传输显著变小)
    gzip            on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json image/svg+xml;

    # 带 hash 指纹的构建产物 → 长期强缓存
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # 图片素材 → 中期缓存
    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires    30d;
        add_header Cache-Control "public";
    }

    # 入口 HTML 不缓存, 保证每次发版都能拿到最新的 assets 引用
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # HashRouter: 任意未知静态路径找不到时回退到 index.html 即可 (无 history 模式深链问题)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
